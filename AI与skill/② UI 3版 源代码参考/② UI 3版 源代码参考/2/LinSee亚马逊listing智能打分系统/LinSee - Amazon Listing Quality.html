<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<title>LinSee · 亚马逊 Listing 智能打分系统 · CDQ v3</title>
<meta name="viewport" content="width=1480" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root {
  --primary-hue: 250;
  --primary: oklch(0.55 0.15 var(--primary-hue));
  --primary-soft: oklch(0.96 0.04 var(--primary-hue));
  --primary-strong: oklch(0.45 0.15 var(--primary-hue));
}
html[data-theme="light"] {
  --bg: oklch(0.985 0.003 270);
  --surface: #ffffff;
  --ink: oklch(0.20 0.012 270);
  --muted: oklch(0.50 0.012 270);
  --border: oklch(0.92 0.005 270);
  --track: oklch(0.94 0.005 270);
}
html[data-theme="dark"] {
  --bg: oklch(0.18 0.013 270);
  --surface: oklch(0.22 0.013 270);
  --ink: oklch(0.94 0.005 270);
  --muted: oklch(0.62 0.012 270);
  --border: oklch(0.30 0.013 270);
  --track: oklch(0.27 0.013 270);
  --primary-soft: oklch(0.30 0.06 var(--primary-hue));
}

* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  font-size: 13px;
  font-feature-settings: 'cv02', 'cv03', 'cv04', 'cv11';
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  letter-spacing: -0.005em;
}

button { font-family: inherit; }
input, select { font-family: inherit; color: inherit; }
table { font-family: inherit; }

/* Table */
.asin-tbl thead th {
  position: sticky; top: 0;
  background: var(--bg);
  font-weight: 500;
  font-size: 10.5px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.04em;
  text-align: center;
  padding: 9px 8px;
  border-bottom: 1px solid var(--border);
}
.asin-tbl tbody td {
  padding: 11px 8px;
  border-bottom: 1px solid var(--border);
  vertical-align: middle;
}
.asin-tbl tbody tr {
  transition: background 0.12s ease;
}
.asin-tbl tbody tr:hover {
  background: var(--primary-soft);
}
.asin-tbl tbody tr:last-child td { border-bottom: none; }

/* Generic card hover */
.card-hover:hover { border-color: var(--primary); }

/* Scrollbar */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }
::-webkit-scrollbar-thumb:hover { background: var(--muted); }

/* Selection */
::selection { background: var(--primary-soft); color: var(--primary-strong); }

/* Subtle grid background */
body::before {
  content: '';
  position: fixed; inset: 0;
  pointer-events: none;
  z-index: 0;
  background-image:
    linear-gradient(to right, var(--border) 1px, transparent 1px),
    linear-gradient(to bottom, var(--border) 1px, transparent 1px);
  background-size: 64px 64px;
  opacity: 0.0;
}

/* Fade-in */
@keyframes fade-up { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
main > * { animation: fade-up 0.28s ease both; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
