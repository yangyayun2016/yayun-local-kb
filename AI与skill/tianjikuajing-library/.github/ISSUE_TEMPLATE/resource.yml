name: 资源对接
description: 登记你能提供或需要的资源
title: "[资源对接] "
labels: ["resource"]
body:
  - type: dropdown
    id: kind
    attributes:
      label: 类型
      options: ["我能提供", "我需要"]
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: 分类
      options: ["供应链", "物流", "合规与税务", "内容与设计", "工具与技术", "学习与社群"]
    validations:
      required: true
  - type: textarea
    id: desc
    attributes:
      label: 一句话说明与适用站点 / 类目
    validations:
      required: true
  - type: dropdown
    id: coop
    attributes:
      label: 合作方式
      options: ["付费", "互换", "免费交流"]
  - type: input
    id: interest
    attributes:
      label: 是否有利益关系（返佣、关联方等）
  - type: markdown
    attributes:
      value: "请不要在此公开手机号、微信号、邮箱等个人联系方式。"
