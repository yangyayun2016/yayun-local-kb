function healthPanel(){return card('广告健康评分','经营表现与数据可用性分开评估',`<div class="healthrow">${scoreRing()}<div class="health-flex"><div class="health-line">整体运行可优化 ${pill('3 项核心问题','red')}</div><div class="health-help">利润约束和部分关键词异常需要复核；当前报告还存在 ABA 口径及跨期引用风险。</div><div class="health-mini-grid"><div><b class="text-red">3</b><span>数据/经营风险</span></div><div><b class="text-blue">5</b><span>增长候选</span></div><div><b class="text-orange">待核对</b><span>利润结论</span></div></div></div></div><div class="inline-box blue">${icon('info',13)} 健康分仅为原型展示。数据可信度、风险严重度和增长潜力采用独立评分，不将缺失数据自动计为满分。</div>`, `<button class="mini-link" data-action="tab" data-value="diagnosis">查看完整诊断 ${icon('right',13)}</button>`)}
function findings(){const a=[['risk','ABA 指标与广告订单冲突','K01 / K02 广告合计 17 单，但周度 ABA 购买份额显示 0%。','先对账','quality'],['orange','预算打满 ≠ 必须扩预算','多个 Campaign 在历史月份 23–30 次打满，需要先判断边际利润。','查看预算','campaigns'],['blue','K03 / K04 有潜力','历史 ACOS 分别 16.7% / 11.1%，但需要验证放量后流量效率。','查看机会','opportunities']];return card('AI 发现的重点问题','证据优先 · 避免机械式自动停投',a.map(([type,title,desc,action,to])=>`<div class="finding"><div class="finding-icon ${type}">${icon(type==='risk'?'alert':type==='orange'?'clock':'bolt',17)}</div><div class="finding-txt"><div class="finding-title">${title}</div><div class="finding-desc">${desc}</div><div class="finding-footer"><button class="finding-footlink" data-action="${to==='quality'?'quality':'tab'}" data-value="${to}">${action} →</button></div></div></div>`).join(''),`<span class="panel-tag">AI INSIGHTS</span>`)}
function bars(){return card('预算约束与效率','来自历史 4 月预算打满样本',`<div style="padding:0 2px">${[['第二层级 · 常规竞价',30,25.2],['K07 · 重开',29,45.3],['第二层级 · 低竞价',28,35.4],['海王',23,21],['销量词 · 低竞价',9,20.5]].map(([l,n,a])=>`<div class="bar-row"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${l}">${l}</span><div class="progress-track"><div class="progress-fill" style="width:${n/30*100}%;background:${a>30?'#f0a7ac':'#78a4f7'}"></div></div><strong>${n} 次</strong></div>`).join('')}</div><div class="inline-box blue">高打满次数不等于高扩量价值。先检查 ACOS、CPA 与预计新增流量质量。</div>`, `<button class="mini-link" data-action="tab" data-value="campaigns">预算详情 ${icon('right',13)}</button>`)}
function overview(){return `${baseNotice()}${stats()}<div class="grid main">${card('广告经营趋势','演示：US 近 7 天广告花费与销售变化',trendChart(), `<span class="panel-tag">PERFORMANCE</span>`)}${healthPanel()}</div><div class="grid main">${findings()}${bars()}</div><div class="section-title"><div><h2>推荐行动 <span style="font-size:11px;color:#8d9bad;font-weight:500">· 基于证据的优先级排序</span></h2><p>可查看证据、模拟收益，然后再送入审批流。</p></div><button class="mini-link" data-action="tab" data-value="actions">进入 AI 行动中心 ${icon('right',13)}</button></div><div class="grid thirds">${state.actions.slice(0,3).map(a=>`<div class="opportunity-card"><div class="oppbar">${pill(a.tag,a.kind==='risk'?'red':'blue')} ${pill(a.confidence+'可信度','gray')}</div><div style="font-weight:800;font-size:13px;line-height:1.6">${a.title}</div><div style="font-size:11px;line-height:1.7;color:#8997aa;min-height:55px;margin:8px 0 12px">${a.desc}</div><button class="mini-link" data-action="proposal" data-value="${a.id}">查看决策依据 ${icon('right',13)}</button></div>`).join('')}</div>${footer()}`}
function footer(){return `<p class="foot-note">${icon('shield',14)} 本 Demo 为独立前端原型，不请求真实 Amazon Ads API，不包含实际账户凭证；所有审批、出价和预算动作仅为本地模拟。</p>`}

function quickInfo(){return `<div class="kv">${[['ASIN','BOXX-01'],['商品','多 SKU 组合产品（约 5 件套）'],['当前价格','$25.99 · 5% Coupon'],['评分 / 评论','4.7 ★ / 65 条'],['FBA 费用','$6.31'],['CDQ / LQS','95 / 100'],['上线日期','2025-01-14'],['销售履约','FBA（示例）']].map(([k,v])=>`<div class="kv-item"><small>${k}</small><strong>${v}</strong></div>`).join('')}</div><div class="pill-row">${pill('Coupon · 5%','blue')}${pill('划线价待核验','gray')}${pill('A+ 已覆盖','green')}${pill('视频已覆盖','green')}${pill('秒杀状态未采集','orange')}${pill('差异化卖点待填充','gray')}</div><div class="data-note">商品与指标使用用户上传截图中的脱敏示例，未对真实 Listing 页面做实时访问。新增标签需要官方 SP-API 或授权的商品快照验证。</div>`}

function profitReport(){return `<div class="inline-box orange">来源：历史诊断截图 `+'`lx_ad_asin_daily`'+` / `+'`lx_profit_asin_daily`'+`。广告后利润率按截图字段展示，需确认 gross_profit 扣费口径。原始数据月份并不连续。</div><div class="table-wrap" style="margin-top:13px"><table class="table"><thead><tr>${['月份','销量','销售额','广告费','ACOS','TACOS','广告后利润','利润率','CPC'].map(s=>`<th>${s}</th>`).join('')}</tr></thead><tbody>${monthly.map(r=>`<tr><td class="name">${r[0]}</td><td>${r[1]}</td><td>${money(r[2])}</td><td>${money(r[3])}</td><td class="numeric ${r[4]>25?'text-red':'text-green'}">${p(r[4])}</td><td>${r[5]==='—'?'—':p(r[5])}</td><td>${money(r[6])}</td><td>${p(r[7])}</td><td>$${r[8].toFixed(2)}</td></tr>`).join('')}</tbody></table></div><div class="inline-box red" style="margin-top:12px">截图中另有“2026-05 ACOS 37.7%、广告后毛利率 29.5%、盈亏 ACOS 约 31%”等信息，存在统计口径或月份数据不完整风险。此处不自动据此计算真实单词止损阈值。</div>`}
function campaignReport(){return `<div class="table-wrap"><table class="table"><thead><tr><th>Campaign</th><th>日预算</th><th>近 3 月花费</th><th>订单</th><th>ACOS</th><th>状态</th></tr></thead><tbody>${campaigns.map(c=>`<tr><td class="name">${c.name}</td><td>${money(c.budget)}</td><td>${money(c.spend)}</td><td>${f(c.orders)}</td><td class="${c.acos>30?'text-red':'text-green'}">${p(c.acos)}</td><td>${pill(c.status,c.status==='活跃'?'green':'gray')}</td></tr>`).join('')}</tbody></table></div><div class="data-note">该 Campaign 表属于截图的“近 3 月”示例，不与广告位历史表按行合计。</div>`}
function placementReport(){return `<div class="table-wrap"><table class="table"><thead><tr><th>Campaign</th><th>广告位</th><th>广告费</th><th>订单</th><th>ACOS</th><th>建议判断</th></tr></thead><tbody>${placements.map(r=>`<tr><td class="name">${r.name}</td><td>${r.place}</td><td>${money(r.spend)}</td><td>${r.orders}</td><td class="numeric ${r.acos>30?'text-red':'text-green'}">${p(r.acos)}</td><td>${r.acos>35?pill('优先排查','red'):r.acos<21?pill('效率较好','green'):pill('继续观察','gray')}</td></tr>`).join('')}</tbody></table></div><div class="data-note">不同 Campaign 的相同 Placement 不可简单平均；调整 Placement 系数通常可能影响活动内多个 Target。</div>`}
function budgetReport(){return `<div class="table-wrap"><table class="table"><thead><tr><th>Campaign</th><th>历史打满次数</th><th>日预算</th><th>诊断方式</th></tr></thead><tbody>${campaigns.filter(c=>c.budgetHit!==null).sort((a,b)=>b.budgetHit-a.budgetHit).map(c=>`<tr><td class="name">${c.name}</td><td class="numeric ${c.budgetHit>25?'text-red':''}">${c.budgetHit} 次</td><td>${money(c.budget)}</td><td>${c.acos!==null&&c.acos>30?pill('高 ACOS · 不直接扩量','orange'):pill('需算边际利润','blue')}</td></tr>`).join('')}</tbody></table></div><div class="inline-box blue" style="margin-top:12px">预算打满表示供给受到限制，不等于增加预算必然带来盈利。需要对比预计额外点击、CVR、商品毛利和预算挤占。</div>`}
function keywordReport(){return `<div class="table-wrap"><table class="table"><thead><tr><th>关键词</th><th>花费</th><th>点击</th><th>订单</th><th>ACOS</th><th>ABA 购买份额</th><th>诊断</th></tr></thead><tbody>${kw.slice(0,8).map(k=>`<tr><td class="name">${k.k}</td><td>${money(k.spend)}</td><td>${k.clicks}</td><td>${k.orders}</td><td class="${k.acos>30?'text-red':'text-green'}">${p(k.acos)}</td><td>${k.purchase}</td><td>${pill(k.kind==='risk'?'需核对':k.kind==='opportunity'?'增长候选':'继续观察',k.kind==='risk'?'red':k.kind==='opportunity'?'green':'gray')}</td></tr>`).join('')}</tbody></table></div>`}

function diagnosis(){return `${baseNotice()}<div class="grid main">${card('BOXX-01 · 广告健康诊断报告','星辰** · 北美 US · 历史诊断截图快照',`<div class="healthrow">${scoreRing()}<div class="health-flex"><div class="health-line">诊断摘要 ${pill('3 个优先待核问题','red')}</div><div class="health-help">广告结构具备历史转化能力，但数据口径、搜索词匹配及预算资源配置仍需验证。</div><div class="pill-row">${pill('ACOS 29.0%','green')}${pill('TACOS 11.8%','blue')}${pill('CVR 4.5%','gray')}${pill('ABA 待对账','orange')}</div></div></div><div class="inline-box orange">注意：诊断报告来自历史多时点截图，与上方店铺 7 天总览不是同一时间范围。</div>`, `<button class="mini-link" data-action="quality">来源与质量 ${icon('right',12)}</button>`)}${card('诊断摘要 · Top 3 风险','运营决策优先看金额、风险及证据可信度',`<div class="insight-list"><div class="insight"><div class="insight-top">${pill('P0','red')} ABA 与广告订单冲突</div><p>K01 / K02 的周度购买份额显示 0%，历史广告订单合计 17 单。禁止仅据此自动暂停。</p></div><div class="insight"><div class="insight-top">${pill('P1','orange')} 利润阈值需要统一</div><p>历史 4 月盈亏 ACOS 约 31% 与后续 5 月数据必须在同一成本和收入口径下复核。</p></div><div class="insight"><div class="insight-top">${pill('P1','blue')} 优质词放量需要边际模拟</div><p>K03 / K04 低 ACOS 值得探索，但预算与竞价变化可能改变 CPC 和 CVR。</p></div></div>` )}</div><div class="section-title"><div><h2>完整诊断报告</h2><p>采用可折叠结构，点击每章展开；数值保留历史数据来源及限制。</p></div>${btn(icon('download',14)+' 导出诊断','export','sm')}</div>${reportData()}${footer()}`}

function campaignsPage(){const data=campaigns.filter(c=>state.campaignFilter==='all'||(state.campaignFilter==='active'?c.status==='活跃':state.campaignFilter==='paused'?c.status!=='活跃':c.acos!==null&&c.acos>30));return `${baseNotice()}<div class="grid thirds"><div class="smallmetric"><div class="lb">已识别的 Campaign</div><b>8 个 <span style="font-size:11px;color:#92a0b4;font-weight:500">· 截图可见</span></b></div><div class="smallmetric"><div class="lb">预算打满最高</div><b>30 次</b></div><div class="smallmetric"><div class="lb">高风险 Placement</div><b>3 组</b></div></div><div class="grid main" style="margin-top:15px">${card('Campaign 投放结构','近 3 月示例，独立于下方广告位历史样本',`<div class="table-wrap"><table class="table"><thead><tr><th>Campaign / 策略</th><th>日预算</th><th>广告费</th><th>订单</th><th>ACOS</th><th>状态</th></tr></thead><tbody>${data.map(c=>`<tr><td><div class="name">${c.name}</div><span style="color:#9ca9ba;font-size:10px">${c.strategy}</span></td><td>${money(c.budget)}</td><td>${money(c.spend)}</td><td>${f(c.orders)}</td><td class="numeric ${c.acos>30?'text-red':'text-green'}">${p(c.acos)}</td><td>${pill(c.status,c.status==='活跃'?'green':'gray')}</td></tr>`).join('')}</tbody></table></div>`, `<button class="mini-link" data-action="quality">跨期校验 ${icon('info',12)}</button>`)}${card('广告结构 AI 诊断','不根据广告名称直接猜测真实投放对象',`<div class="insight-list"><div class="insight"><div class="insight-top">${pill('结构覆盖','blue')} Sponsored Products 为主</div><p>截图展示 12 个 SP Campaign 的历史报告，SB/SD 覆盖需另行核查。</p></div><div class="insight"><div class="insight-top">${pill('预算错配','orange')} 有效活动和低效活动同时受限</div><p>预算建议需对比各 Campaign 的增量利润，不可按“打满次数”排序扩预算。</p></div><div class="insight"><div class="insight-top">${pill('控制粒度','gray')} Campaign / Placement</div><p>广告位调整可能影响同一 Campaign 内多个 Target。执行前应模拟影响面。</p></div></div>` )}</div><div style="margin-top:-2px" class="filter-row">${filterChips([['all','全部 Campaign'],['active','活跃'],['paused','已暂停'],['risk','高 ACOS']],state.campaignFilter,'campaignFilter')}</div><div class="grid main">${card('广告位表现 · Campaign × Placement','来自截图历史广告位表，不与近 3 月 Campaign 直接求和',placementReport(), `<span class="panel-tag">PLACEMENT ANALYSIS</span>`)}${bars()}</div><div class="grid halves">${card('预算重新分配逻辑','建议先做场景模拟',`<div class="inline-box blue">例：销量词低竞价的日预算 $3 → $10，增加的是最高可花额度 $7/天；实际增量花费取决于流量、出价和预算竞争。</div><div style="margin-top:12px">${btn(icon('sliders',14)+' 计算目标 Bid','simulate','soft')} ${btn(icon('bolt',14)+' 查看审批动作','tab','sm','data-value="actions"')}</div>`)}${card('建议信号','当前仅生成候选策略，不直接修改账户',`<div class="check-line"><span class="symbol">${icon('check',12)}</span> 优先关注低 CPA 且能获取新增流量的活动</div><div class="check-line"><span class="symbol">${icon('check',12)}</span> 首位高 ACOS：核实是否为 Placement 系数过高</div><div class="check-line"><span class="symbol">${icon('check',12)}</span> 搜索词与 Target 数据可回溯至匹配类型</div>`)}</div>${footer()}`}
function opportunities(){const kinds={risk:'需核对',opportunity:'增长候选',watch:'探索观察'};const filtered=kw.filter(x=>state.keywordFilter==='all'||x.kind===state.keywordFilter);return `${baseNotice()}<div class="section-title" style="margin-top:17px"><div><h2>关键词机会雷达</h2><p>将广告 Target、ABA 搜索表现、历史自然排名与利润约束结合。</p></div>${btn(icon('sliders',14)+' 出价模拟','simulate','soft')}</div><div class="grid thirds"><div class="opportunity-card"><div class="oppbar">${pill('利润效率','green')} ${icon('target',18)}</div><div class="oppkeyword">K03 / K04</div><div class="task-desc">低历史 ACOS 与购买表现提示放量机会，先预测边际流量回报。</div></div><div class="opportunity-card"><div class="oppbar">${pill('证据冲突','red')} ${icon('alert',18)}</div><div class="oppkeyword">K01 / K02</div><div class="task-desc">ABA 周度份额 0% 不等于广告零订单，先对账再谈暂停。</div></div><div class="opportunity-card"><div class="oppbar">${pill('探索空白','blue')} ${icon('sparkles',18)}</div><div class="oppkeyword">K07 / K10</div><div class="task-desc">市场搜索机会明显，但广告点击样本有限，控制探索成本。</div></div></div><div class="section-title"><div><h2>Target × ABA 多维词库</h2><p>点击任何一行的「证据」可查看来源冲突和建议状态。</p></div></div><section class="panel"><div style="padding-top:16px" class="filter-row">${filterChips([['all','全部关键词'],['risk','风险待核对'],['opportunity','增长候选'],['watch','探索观察']],state.keywordFilter,'keywordFilter')}</div><div class="table-wrap"><table class="table"><thead><tr><th>关键词</th><th>广告花费</th><th>点击</th><th>广告订单</th><th>广告 ACOS</th><th>ABA 点击/购买份额</th><th>分类</th><th>操作</th></tr></thead><tbody>${filtered.map(k=>`<tr><td><div class="name">${k.k}</div><div style="font-size:10px;color:#9ba8bb;margin-top:4px">${k.term}</div></td><td>${money(k.spend)}</td><td>${k.clicks}</td><td>${k.orders}</td><td class="numeric ${k.acos>30?'text-red':'text-green'}">${p(k.acos)}</td><td>${k.share} / ${k.purchase}</td><td>${pill(kinds[k.kind],k.kind==='risk'?'red':k.kind==='opportunity'?'green':'orange')}</td><td class="action-cell"><button class="mini-link" data-action="keyword" data-value="${k.k}">查看证据 ${icon('right',12)}</button></td></tr>`).join('')}</tbody></table></div></section><div class="grid halves" style="margin-top:16px">${card('ABA 相对购买份额效率','同查询/同 ASIN/同期间时才可以比较',`<div class="table-wrap"><table class="table" style="min-width:350px"><thead><tr><th>词</th><th>点击份额</th><th>购买份额</th><th>购买/点击比值</th></tr></thead><tbody>${kw.filter(k=>k.share!=='—'&&k.purchase!=='—').map(k=>`<tr><td class="name">${k.k}</td><td>${k.share}</td><td>${k.purchase}</td><td class="numeric">${(parseFloat(k.purchase)/parseFloat(k.share)).toFixed(2)}×</td></tr>`).join('')}</tbody></table></div><div class="data-note">购买份额与点击份额比值不是 CVR；0% 购买份额需留意小数显示精度和统计周期。</div>`)}${card('词的空白 · 推荐分层','示例：K10、K11、K12 的自然排名与广告覆盖',`<div class="insight-list"><div class="insight"><div class="insight-top">${pill('K10','green')} P2 #77 · 购买份额 80%</div><p>研究高购买份额是否有足够订单样本，再测试精准词广告。</p></div><div class="insight"><div class="insight-top">${pill('K11','blue')} P2 #64 · 自然排名较弱</div><p>有自然排名但广告覆盖低，适合创建小预算测试候选。</p></div><div class="insight"><div class="insight-top">${pill('K12','gray')} P1 #20 · 自然表现较好</div><p>优先判断防守型投放是否会替代自然订单，避免不必要广告支出。</p></div></div>` )}</div>${footer()}`}
function causeTimeline(){return `<div class="timeline">${[['4 月中旬','类目排名正常区间','自身 BSR 约 #700–1,100，同行竞品表现相对稳定。'],['4 月 26–30 日','广告可能提前受限','截图提到部分 Campaign 上午预算打满，需核查完整小时级记录。'],['5 月 1 日','出现广告花费为零的记录','必须检查状态、API 同步、购买资格，不能仅归因于 CPC 上涨。'],['5 月 6 日','广告花费约 $0.50','与销量下滑同期发生，属于关联证据。'],['5 月 6–10 日','自身及竞品 BSR 同步恶化','提示存在市场共同变化，需与商品自身变化分开。']].map(([d,t,desc])=>`<div class="timeline-row"><div class="timeline-dot"></div><div><div class="timeline-t">${d}</div><div class="timeline-title">${t}</div><div class="timeline-desc">${desc}</div></div></div>`).join('')}</div>`}
function competitor(){return `${baseNotice()}<div class="section-title" style="margin-top:18px"><div><h2>竞争可见性与排名根因</h2><p>把 Allyhub / SIF 搜索快照、广告花费、排名变化汇总到一个事件时间线。</p></div>${pill('证据等级 B–C','orange')}</div><div class="grid main">${card('BSR 横向对比 · 历史截图','BSR 为相对销量排名，不能按数值比例推算销量',rankReport(), `<span class="panel-tag">COMPETITIVE SIGNALS</span>`)}${card('根因候选 · 需要交叉验证','不直接宣布单一原因',`<div class="insight-list"><div class="insight"><div class="insight-top">${pill('证据 B','blue')} 广告投入显著下降</div><p>截图显示 4 月日广告花费 $18–30，5 月 6 日约 $0.50。需排除暂停与报告缺失。</p></div><div class="insight"><div class="insight-top">${pill('证据 B','blue')} 市场竞争/需求同步变化</div><p>多个竞品 BSR 变差，支持市场共同因素假设，但还未核验真实销量。</p></div><div class="insight"><div class="insight-top">${pill('证据 C','orange')} 预算上午打满影响流量</div><p>历史存在多次预算限制，但需核实具体时段是否与下滑时期匹配。</p></div><div class="insight"><div class="insight-top">${pill('待核实','gray')} 价格、Coupon、库存、Buy Box</div><p>以上数据不完整，尚不足以排除商品基本面或购买资格问题。</p></div></div>` )}</div><div class="grid halves">${card('销量与排名变化 · 事件时间线','按先后顺序提供证据，不自动等同于因果',causeTimeline())}${card('需要补齐的数据清单','完成后才能升级根因结论可信度',`<div class="check-line"><span class="symbol">${icon('clock',13)}</span> Campaign 状态变更与暂停日志</div><div class="check-line"><span class="symbol">${icon('clock',13)}</span> Amazon Marketing Stream 小时级花费</div><div class="check-line"><span class="symbol">${icon('clock',13)}</span> 主关键词自然位快照与类目需求变化</div><div class="check-line"><span class="symbol">${icon('clock',13)}</span> 库存 / Buy Box / Coupon 时间线</div><div class="check-line"><span class="symbol">${icon('clock',13)}</span> 同类竞品销量与广告位数据</div><div style="margin-top:12px">${btn(icon('shield',14)+' 查看数据来源风险','quality','soft')}</div>`)}</div>${footer()}`}
function simMath(){const {bid,cvr,aov,acos,goal,limit}=state.sim;let m=aov*(cvr/100)*(acos/100)*(goal/100);let lo=bid*(1-limit/100),hi=bid*(1+limit/100);let s=Math.max(lo,Math.min(m,hi));let currentCpa=bid/(cvr/100), currentAcos=100*bid/(aov*(cvr/100));return {m,s,currentCpa,currentAcos,lo,hi}}
function simPanel(){let m=simMath();return `<div class="scenario-controls">${[['bid','当前设置 Bid','$',.10,2,.05],['cvr','预测 CVR','%',1,15,.5],['aov','净销售金额','$',15,100,1],['acos','目标 ACOS','%',5,55,1],['goal','Goal 系数','%',60,150,5],['limit','最大单次调价','%',5,30,5]].map(([key,label,unit,min,max,step])=>`<div class="field"><div class="field-line"><label>${label}</label><span class="field-value" id="lbl-${key}">${unit==='$'?'$':''}${Number(state.sim[key]).toFixed(key==='bid'?2:key==='cvr'?1:0)}${unit==='%'?'%':''}</span></div><input class="range" type="range" min="${min}" max="${max}" step="${step}" value="${state.sim[key]}" data-sim="${key}" aria-label="${label}"/></div>`).join('')}</div><div class="simoutput" style="margin-top:18px"><div class="simresult"><small>模型 Value Bid</small><b class="text-blue" id="sim-model">$${m.m.toFixed(3)}</b></div><div class="simresult"><small>应用涨跌保护后</small><b id="sim-safe">$${m.s.toFixed(3)}</b></div><div class="simresult"><small>当前设置 Bid / CVR 示意 CPA</small><b id="sim-cpa">$${m.currentCpa.toFixed(2)}</b></div></div><div class="inline-box orange" style="margin-top:13px">模拟器复用价值出价思路，但<strong>设置 Bid 不等于实际 CPC</strong>。此处 CPA 采用设置 Bid 近似计算，仅用于教学；不包含竞价响应曲线、广告位系数、利润成本及归因延迟。</div>`}
function actions(){const filtered=state.actions.filter(x=>state.proposalFilter==='all'||(state.proposalFilter==='pending'?x.status==='待审核':state.proposalFilter==='approved'?x.status==='已批准':x.status==='已模拟执行'));return `${baseNotice()}<div class="grid main">${card('AI 决策与出价模拟器','价值 Bid × CVR × AOV × 目标 ACOS · 带单次涨跌幅保护',simPanel(), `<button class="mini-link" data-action="simReset">重置参数 ${icon('refresh',13)}</button>`)}${card('审批与执行策略','此 Demo 不会调用任何生产广告 API',`<div class="insight-list"><div class="insight"><div class="insight-top">${pill('01','blue')} 证据核对</div><p>先匹配真实 Target、时间周期、归因窗口、商品成本；不一致时仅生成待核验事项。</p></div><div class="insight"><div class="insight-top">${pill('02','blue')} 模型和安全保护</div><p>计算预测价值、竞价限制、预算风险；新增流量的收益预测需要额外模型。</p></div><div class="insight"><div class="insight-top">${pill('03','blue')} 人工审批</div><p>更改出价、否词、Campaign 预算应具有操作对象、原值、新值和审核者。</p></div><div class="insight"><div class="insight-top">${pill('04','blue')} 模拟执行后复盘</div><p>保留状态审计；生产环境才需要 Ads API 回读确认与 7/14/30 天复盘。</p></div></div><div style="margin-top:15px">${btn(icon('bolt',14)+' 从模拟器创建审批单','createSimProposal','primary')}</div>` )}</div><div class="section-title"><div><h2>决策审批队列</h2><p>以下动作均为候选建议，可展开证据、批准、驳回或本地模拟执行。</p></div><div class="seg">${[['all','全部'],['pending','待审核'],['approved','已批准'],['executed','模拟完成']].map(([v,t])=>`<button class="${state.proposalFilter===v?'active':''}" data-action="proposalFilter" data-value="${v}">${t}</button>`).join('')}</div></div><div class="grid halves">${filtered.length?filtered.map(a=>`<div class="taskcard"><div class="task-icon" style="background:${a.kind==='risk'?'#fff0f0':'#edf4ff'};color:${a.kind==='risk'?'#eb6269':'#3174ee'}">${icon(a.kind==='risk'?'alert':'target',17)}</div><div style="min-width:0;flex:1"><div class="task-title">${a.title}</div><div class="task-desc">${a.desc}</div><div class="task-foot">${pill(a.tag,a.kind==='risk'?'red':'blue')}${pill(a.status,a.status==='已模拟执行'?'green':a.status==='已批准'?'blue':a.status==='已驳回'?'gray':'orange')}<span style="font-size:10px;color:#92a1b4">${a.id}</span></div><div style="margin-top:11px;display:flex;gap:7px;flex-wrap:wrap"><button class="btn sm" data-action="proposal" data-value="${a.id}">${icon('eye',13)} 查看证据</button>${a.status==='待审核'?`<button class="btn sm primary" data-action="approve" data-value="${a.id}">${icon('check',13)} 审批通过</button>`:''}${a.status==='已批准'?`<button class="btn sm primary" data-action="execute" data-value="${a.id}">${icon('play',12)} 模拟执行</button>`:''}</div></div></div>`).join(''):`<div class="panel empty">没有符合当前筛选条件的建议</div>`}</div><div class="section-title"><div><h2>执行审计日志</h2><p>操作只保存在当前页面的本地内存，刷新后恢复演示初始状态。</p></div>${btn(icon('download',14)+' 导出审计 CSV','exportAudit','sm')}</div>${card('最近操作','展示审批、驳回与模拟执行行为',state.audits.length?`<div class="table-wrap"><table class="table"><thead><tr><th>时间</th><th>操作</th><th>目标</th><th>结果</th></tr></thead><tbody>${state.audits.map(r=>`<tr><td>${r.at}</td><td class="name">${r.action}</td><td>${r.target}</td><td>${pill(r.result,'blue')}</td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">${icon('file',28)}<strong>尚无操作记录</strong>点击审批通过，然后模拟执行，即可生成审计数据。</div>`)}${footer()}`}
function qualityModal(){return `<div class="modal-head"><h2>${icon('shield',19)} 数据可信度与来源审计</h2><button class="topbtn" data-action="close">${icon('close',19)}</button></div><div class="modal-body"><div class="inline-box orange"><b>重要：</b>本原型使用你提供的 18 张脱敏截图建立演示数据。不同截图时间范围、产品、账户聚合方式不一定一致，系统默认不对不同来源进行自动相加。</div><div class="insight-list" style="margin-top:14px"><div class="insight"><div class="insight-top">${pill('高优先级','red')} ABA 0% 与广告订单不等价</div><p>K01、K02 具有历史广告归因订单，ABA 周度购买份额为 0%。需核查同一 ASIN、Search Query、周期和数据四舍五入情况。</p></div><div class="insight"><div class="insight-top">${pill('高优先级','red')} 店铺范围和合计冲突</div><p>原首页同时展示 US/DE/JP，但某个合计文案标注 1 店铺、花费数值仅等于 US。Demo 严格按所选账户展示 KPI。</p></div><div class="insight"><div class="insight-top">${pill('中优先级','orange')} 2026 年 4/5 月盈亏口径</div><p>盈亏 ACOS 约 31% 与 5 月广告后利润率等必须核对净销售收入、成本、广告归因销售及统计周期。</p></div><div class="insight"><div class="insight-top">${pill('中优先级','orange')} 历史样本时间不一致</div><p>月度利润、近 3 月 Campaign、4 月 Placement、5 月 ABA 周报、6 月店铺快照来自不同来源，不能直接形成同一期合计。</p></div></div><div class="data-note">已校验的演示数据是截图中可见的历史数值；模拟趋势和非原图的辅助评分不代表真实实盘测量。</div></div><div class="modal-foot">${btn('了解，关闭','close','primary')}</div>`}
function keywordDrawer(k){const issue=k.kind==='risk'?'风险待核对':k.kind==='opportunity'?'可测试的增长机会':'样本不足';return `<div class="drawer-header"><div><div class="eyebrow">KEYWORD INTELLIGENCE · ${k.k}</div><h2>${k.k} · ${k.term}</h2></div><button class="topbtn" data-action="close">${icon('close',19)}</button></div><div class="drawer-body"><div class="drawer-section"><h4>历史广告表现（截图示例）</h4><div class="kv" style="grid-template-columns:repeat(2,1fr)">${[['广告花费',money(k.spend)],['点击',f(k.clicks)],['归因订单',f(k.orders)],['广告 ACOS',p(k.acos)]].map(([l,v])=>`<div class="kv-item"><small>${l}</small><strong>${v}</strong></div>`).join('')}</div></div><div class="drawer-section"><h4>ABA / 外部市场信号</h4><div class="kv" style="grid-template-columns:repeat(2,1fr)">${[['截图查询量',k.vol],['ABA 点击份额',k.share],['ABA 购买份额',k.purchase],['自然排名',k.rank]].map(([l,v])=>`<div class="kv-item"><small>${l}</small><strong>${v}</strong></div>`).join('')}</div><p class="data-note">ABA 周报与广告历史数据可能来自不同时间，必须匹配站点、ASIN 和查询词后才能联合归因。</p></div><div class="drawer-section"><h4>AI 诊断状态 ${pill(issue,k.kind==='risk'?'red':k.kind==='opportunity'?'green':'orange')}</h4><div style="font-size:12px;line-height:1.8;color:#52657e">${k.reason}</div><div class="inline-box blue" style="margin-top:12px">建议遵循：核对原始报告 → 确认利润约束 → 模拟边际收益 → 审批动作。</div></div><div class="drawer-section"><h4>来源与可信度</h4><div class="check-line">${icon('file',14)} 历史广告表现 · 已从截图读取</div><div class="check-line">${icon('file',14)} ABA 查询表现 · 周期需匹配</div><div class="check-line">${icon('clock',14)} 当前设置 Bid / 真实可写 Target ID · 尚未接入</div></div></div><div class="drawer-footer">${btn(icon('sliders',14)+' 出价模拟','simulate','sm')}${btn(icon('bolt',14)+' 转入行动中心','tab','primary','data-value="actions"')}</div>`}
function proposalDrawer(a){const approved=a.status==='已批准',isDone=a.status==='已模拟执行',dismissed=a.status==='已驳回';return `<div class="drawer-header"><div><div class="eyebrow">AI ACTION PROPOSAL · ${a.id}</div><h2>${a.title}</h2></div><button class="topbtn" data-action="close">${icon('close',19)}</button></div><div class="drawer-body"><div class="pill-row">${pill(a.tag,a.kind==='risk'?'red':'blue')}${pill(a.status,isDone?'green':approved?'blue':'orange')}${pill('可信度 '+a.confidence,'gray')}</div><div class="drawer-section"><h4>建议原因</h4><div style="font-size:12px;line-height:1.9;color:#52657e">${a.desc}</div><div class="inline-box orange" style="margin-top:12px">所有历史指标仅来自脱敏截图。出价、API ID、实时账户状态尚未验证；审批/执行为本地模拟。</div></div><div class="drawer-section"><h4>对象与预期影响</h4><div class="kv" style="grid-template-columns:repeat(2,1fr)"><div class="kv-item"><small>目标</small><strong>${a.target}</strong></div><div class="kv-item"><small>收益说明</small><strong>${a.impact}</strong></div><div class="kv-item"><small>审批状态</small><strong>${a.status}</strong></div><div class="kv-item"><small>动作编号</small><strong>${a.id}</strong></div></div></div><div class="drawer-section"><h4>安全检查</h4><div class="check-line">${icon('check',14)} 不关联真实 Amazon 授权</div><div class="check-line">${icon('alert',14)} 生产执行前核对归因/利润/账户</div><div class="check-line">${icon('alert',14)} 需真实 Target ID、当前设置值与限额</div><div class="check-line">${icon('check',14)} 操作将写入演示审计日志</div></div></div><div class="drawer-footer">${!isDone&&!dismissed&&!approved?`${btn('驳回','reject','sm',`data-value="${a.id}"`)}${btn(icon('check',14)+' 审批通过','approve','primary',`data-value="${a.id}"`)}`:approved?`${btn(icon('play',14)+' 模拟执行','execute','primary',`data-value="${a.id}"`)}`:btn('关闭','close','sm')}</div>`}
function modalWrap(body){return `<div class="overlay" data-action="shade-close"><div class="modal">${body}</div></div>`}
function drawerWrap(body){return `<div class="drawer-shade" data-action="shade-close"><aside class="drawer">${body}</aside></div>`}
function portal(){let output='';if(state.modal==='quality')output=modalWrap(qualityModal());if(state.modal==='diagnose')output=modalWrap(`<div class="modal-head"><h2>${icon('refresh',19)} 诊断任务模拟</h2><button class="topbtn" data-action="close">${icon('close',19)}</button></div><div class="modal-body"><div class="inline-box blue">本演示会模拟扫描各分析环节，不会请求实际 Ads、BA、SIF 或 Allyhub 服务。</div><div class="progress-track" style="height:10px;margin:23px 0"><div id="diagProgress" class="progress-fill" style="width:0%"></div></div><div id="diagStatus" style="font-size:12px;color:#7d8da4">等待开始</div></div><div class="modal-foot">${btn('开始模拟扫描','startScan','primary')}</div>`);if(state.drawer){if(state.drawer.type==='keyword'){let k=kw.find(k=>k.k===state.drawer.id);if(k)output=drawerWrap(keywordDrawer(k))}else if(state.drawer.type==='proposal'){let a=state.actions.find(a=>a.id===state.drawer.id);if(a)output=drawerWrap(proposalDrawer(a))}}document.getElementById('portal').innerHTML=output}
function render(){document.getElementById('app').innerHTML=`<div class="app">${sidebar()}<div class="shell">${header()}<main class="workspace">${renderPageTop()}<div class="bodyspace">${state.account!=='US'?`<div class="notice warn" style="margin-bottom:13px"><strong>站点范围提示：</strong>当前顶部 KPI 切换到 ${state.account} 站；下方 K 编号及 BOXX-01 的历史诊断固定属于 US 演示样本，无法用于该站点实盘操作。</div>`:''}${{overview,diagnosis,campaigns:campaignsPage,opportunities,competitor,actions}[state.tab]()}</div></main></div></div>`;portal()}
function updateSim(){let m=simMath();for(const [id,value] of [['sim-model','$'+m.m.toFixed(3)],['sim-safe','$'+m.s.toFixed(3)],['sim-cpa','$'+m.currentCpa.toFixed(2)]]){let e=document.getElementById(id);if(e)e.textContent=value}}
function createAction(){let m=simMath(),id='ACT-'+String(200+state.actions.length);state.actions.unshift({id,title:`出价模拟：设置 Bid $${state.sim.bid.toFixed(2)} → $${m.s.toFixed(3)}`,kind:'opportunity',tag:'模型模拟',confidence:'示例',desc:`CVR ${state.sim.cvr}%、AOV $${state.sim.aov}、目标 ACOS ${state.sim.acos}%。仅为演示，需实际 Target ID 与风险验证。`,target:'待绑定真实 Target',impact:'尚无可验证边际收益',status:'待审核',level:'中'});state.proposalFilter='pending';toast('已创建模拟审批单 '+id+'，没有修改真实广告');render()}
function logAction(action,target,result){state.audits.unshift({at:new Date().toLocaleString('zh-CN',{hour12:false}),action,target,result})}
function setProposalStatus(id,status){const a=state.actions.find(v=>v.id===id);if(!a)return;if(status==='已模拟执行'&&a.status!=='已批准'){toast('请先完成审批');return}a.status=status;if(state.proposalFilter==='pending'&&status!=='待审核')state.proposalFilter='all';logAction(status,a.title,'仅本地演示');toast(a.title+' · '+status+'（本地模拟）');if(state.drawer&&state.drawer.type==='proposal')state.drawer={type:'proposal',id};render()}
function exportCSV(a,name){const csv='\ufeff'+a.map(row=>row.map(c=>'"'+String(c===null||c===undefined?'':c).replaceAll('"','""')+'"').join(',')).join('\r\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob);const e=document.createElement('a');e.href=url;e.download=name;e.click();setTimeout(()=>URL.revokeObjectURL(url),500)}
function exportReport(){let rows=[['模块','指标','数值','来源'],['基础','ASIN','BOXX-01','截图脱敏示例'],['诊断','健康评分','82','截图原报告'],...monthly.map(r=>['月度经营',r[0],`销售 ${r[2]} / 花费 ${r[3]} / ACOS ${r[4]}%`,'截图历史月报']),...kw.map(k=>['关键词',k.k,`花费 ${k.spend} / 订单 ${k.orders} / ACOS ${p(k.acos)}`,'截图脱敏示例'])];exportCSV(rows,'天机AI_广告健康诊断_演示数据.csv');toast('已导出演示报告 CSV')}
function startScan(){const e=document.getElementById('diagProgress'),text=document.getElementById('diagStatus');if(!e||!text)return;const stages=['校验 ASIN / 广告 Profile','扫描商品与 Listing 信息','收集广告与财务历史数据','加载 Target、Placement、ABA','检测跨期与口径冲突','生成诊断结果与候选行动'];let idx=0;let btnEl=document.querySelector('[data-action="startScan"]');if(btnEl)btnEl.disabled=true;const fn=()=>{if(!document.getElementById('diagProgress'))return;const done=idx+1;e.style.width=Math.round(done/stages.length*100)+'%';text.textContent=stages[idx]+' · '+done+'/'+stages.length;idx++;if(idx<stages.length)setTimeout(fn,350);else{setTimeout(()=>{toast('模拟诊断完成 · 发现需核对的历史数据冲突');state.modal=null;selectTab('diagnosis')},500)}};fn()}
window.addEventListener('keydown',e=>{if(e.key==='Escape'&&(state.drawer||state.modal)){state.drawer=null;state.modal=null;portal()}if(e.key==='Enter'&&e.target.id==='globalSearch'){const q=e.target.value.toUpperCase().trim();if(q){state.keywordFilter='all';selectTab('opportunities');const found=kw.find(k=>k.k===q);if(found){state.drawer={type:'keyword',id:q};portal()}else toast('已进入关键词机会页；可从表格筛选相关数据')}}});
document.addEventListener('change',e=>{if(e.target.id==='accountSelect'){state.account=e.target.value;render();toast('已切换演示账户范围')} });
document.addEventListener('input',e=>{let key=e.target.dataset.sim;if(!key)return;state.sim[key]=Number(e.target.value);let el=document.getElementById('lbl-'+key);if(el)el.textContent=(key==='bid'||key==='aov'?'$':'')+Number(state.sim[key]).toFixed(key==='bid'?2:key==='cvr'?1:0)+(key!=='bid'&&key!=='aov'?'%':'');updateSim()});
document.addEventListener('click',e=>{const t=e.target.closest('[data-action]');if(!t)return;const a=t.dataset.action,v=t.dataset.value;if(a==='shade-close'&&e.target.closest('.modal,.drawer'))return;if(t.tagName==='A'||a==='shade-close')e.preventDefault();switch(a){case 'nav':if(v==='overview'&&t.textContent.trim()!=='广告中心')toast('本 Demo 聚焦广告中心，已打开可用工作区');selectTab(v);break;case 'tab':selectTab(v);break;case 'period':state.period=v;render();if(v!=='7')toast('30/90 天总览为基于截图的示意外推，非实盘数据');break;case 'keywordFilter':state.keywordFilter=v;render();break;case 'campaignFilter':state.campaignFilter=v;render();break;case 'proposalFilter':state.proposalFilter=v;render();break;case 'keyword':state.drawer={type:'keyword',id:v};portal();break;case 'proposal':state.drawer={type:'proposal',id:v};portal();break;case 'quality':state.drawer=null;state.modal='quality';portal();break;case 'notifications':toast('当前有 3 项数据与策略风险需要复核');break;case 'diagnose':state.modal='diagnose';portal();break;case 'startScan':startScan();break;case 'collapse':state.reportOpen[v]=state.reportOpen[v]===false?true:false;render();const re=document.getElementById('r-'+v);if(re)re.scrollIntoView({block:'start'});break;case 'simulate':state.drawer=null;state.modal=null;selectTab('actions');break;case 'simReset':state.sim={bid:.60,cvr:5,aov:35,acos:30,goal:100,limit:15};render();break;case 'createSimProposal':createAction();break;case 'approve':setProposalStatus(v,'已批准');break;case 'reject':setProposalStatus(v,'已驳回');break;case 'execute':setProposalStatus(v,'已模拟执行');break;case 'close':case 'shade-close':state.modal=null;state.drawer=null;portal();break;case 'export':exportReport();break;case 'exportAudit':exportCSV([['时间','操作','目标','结果'],...state.audits.map(x=>[x.at,x.action,x.target,x.result])],'天机AI_操作审计_演示.csv');toast('已导出当前会话审计日志');break;default:break;}});
render();
</script></body></html>
